<text class="f-dark" x="40" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal">ENVELOPE A LEVEL, SHAPE 1101 (ATTACK, HOLD): EACH R13 WRITE SETS IT BACK TO 0</text>
