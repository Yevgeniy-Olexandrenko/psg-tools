<text class="f-ink" x="408" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal">BANK B</text>
<line class="s-ink" x1="468" y1="88" x2="502" y2="88" stroke-width="1.5" marker-end="url(#arrow)"/>
